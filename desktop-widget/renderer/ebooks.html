<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>手機控制與電子書</title><link rel="stylesheet" href="base.css"><style>body{background:#eff8f1;padding:24px;margin:0}main{max-width:700px;margin:auto}h1{font-size:26px}p{line-height:1.7}section{padding:16px;background:#fff;border:1px solid #d4e5d9;border-radius:16px;margin:12px 0}.path{font-size:12px;overflow-wrap:anywhere;color:#72897b}.row{display:flex;gap:8px;flex-wrap:wrap}.input{min-width:0}.input.name{flex:1}label{font-weight:800}.status{font-weight:700;color:#14604f}</style><main><h1>📚 手機控制與電子書</h1><p>先連接和電腦網頁相同的班級，再選取原本雙擊使用的電子書捷徑。檔案路徑只存在這台電腦。</p><div id="status" class="status" role="status"></div><section><label><input type="checkbox" id="enable"> 啟用手機控制（桌面計時器、抽籤、出席、任務及已設定電子書）</label><p>電腦名稱：<input class="input" id="name" maxlength="30"></p><p class="path">在網頁「系統設定 → 連接手機 → 教材捷徑」選擇「桌面電子書程式」，即可指定這裡的項目。</p></section><section><label><input type="checkbox" id="backgroundStartup"> 登入 Windows 後自動在背景待命</label><p>啟用後不會先顯示加分面板；手機按「開啟最新版桌面小工具」才展開。新版本請放進已設定的桌面工具資料夾。</p><p class="path">已啟用手機控制時，面板的 × 只關閉畫面並繼續接收。若要完全停止，請在系統匣選「結束（停止手機接收）」。電腦須開機且連線。</p></section><div id="slots"></div></main><script src="core/util.js"></script><script src="ebooks.js"></script></html>
