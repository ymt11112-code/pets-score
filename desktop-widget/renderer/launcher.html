<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>桌面小工具啟動資料夾</title><link rel="stylesheet" href="base.css"><style>body{margin:0;padding:26px;background:#eff8f1}main{max-width:700px;margin:auto}.box{background:#fff;padding:20px;border:1px solid #d5e6dc;border-radius:18px;margin:16px 0}h1{font-size:25px}p{line-height:1.7}.path{width:100%;box-sizing:border-box;min-height:90px;resize:none}.row{display:flex;gap:10px;flex-wrap:wrap}#latest{font-weight:800;color:#146453}</style><main><h1>🖥️ 桌面小工具啟動資料夾</h1><p>PC 點浮動星星時，啟動器會從這個資料夾找版本號最大的桌面小工具。手機與平板的浮動星星則開啟遙控器。</p><section class="box"><label for="folder">EXE 所在資料夾</label><textarea id="folder" class="input path" readonly></textarea><p id="latest" role="status"></p><div class="row"><button id="choose" class="btn btn--primary">選擇／變更資料夾</button><button id="test" class="btn btn--ghost">測試開啟最新版</button></div></section><p>請將新版「班級加點小工具 x.y.z.exe」放在這個資料夾，保留原檔名。版本號會按數字比較，不會把 1.9 誤認為比 1.13 新。路徑只保存在這台電腦。</p></main><script src="core/util.js"></script><script src="launcher.js"></script></html>
